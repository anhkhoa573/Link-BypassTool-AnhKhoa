<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bypass Tool VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#00e5ff;--purple:#a855f7;--pink:#ff2d95;--green:#00ff88;--bg1:#05050a;--border:#252545;--text:#e8e8ff;--muted:#6b6b8a;--input-bg:#0d0d14}
html,body{height:100%;font-family:Rajdhani,sans-serif;background:var(--bg1);color:var(--text);overflow-x:hidden}
.bg-anim{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,rgba(0,229,255,.12),transparent 40%),radial-gradient(circle at 80% 80%,rgba(168,85,247,.12),transparent 40%),var(--bg1)}
.bg-anim::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite}
@keyframes gridMove{to{transform:translate(50px,50px)}}
.particle{position:fixed;width:3px;height:3px;background:var(--cyan);border-radius:50%;pointer-events:none;opacity:.5;box-shadow:0 0 10px var(--cyan);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-10vh) scale(1);opacity:0}}
.container{max-width:560px;margin:0 auto;padding:30px 20px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:100%;background:linear-gradient(145deg,rgba(22,22,42,.95),rgba(15,15,26,.98));border:1px solid var(--border);border-radius:24px;padding:35px 28px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;background:linear-gradient(45deg,var(--cyan),var(--purple),var(--pink),var(--cyan));background-size:400% 400%;border-radius:24px;z-index:-1;opacity:.4;animation:borderGlow 8s ease infinite;filter:blur(8px)}
@keyframes borderGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.header{text-align:center;margin-bottom:25px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);border-radius:100px;font-size:.7rem;color:var(--cyan);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:15px}
.badge::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green);animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.3}}
.title{font-family:Orbitron,sans-serif;font-size:1.8rem;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;letter-spacing:2px;margin-bottom:6px}
@keyframes shine{to{background-position:200% center}}
.subtitle{color:var(--muted);font-size:.85rem;letter-spacing:1px}
.label{font-size:.8rem;color:var(--muted);margin-bottom:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-top:18px}
select,.input-url{width:100%;padding:14px 16px;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:Rajdhani,sans-serif;font-size:.95rem;outline:none;transition:all .3s}
select:focus,.input-url:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.1)}
select option{background:var(--input-bg);color:var(--text)}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:Rajdhani,sans-serif;font-size:1rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .25s;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;box-shadow:0 10px 30px rgba(0,229,255,.3);margin-top:20px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s}
.btn:hover::before{left:100%}
.btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,229,255,.5)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.result{margin-top:20px;padding:18px;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;display:none}
.result.show{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result h3{color:var(--cyan);font-size:.85rem;margin-bottom:10px;letter-spacing:1px;text-transform:uppercase}
.link-box{background:#05050a;padding:14px;border-radius:10px;font-family:Consolas,monospace;font-size:.82rem;color:var(--green);word-break:break-all;border:1px solid var(--border);line-height:1.6}
.copy-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--green),#00cc66);color:#05050a;font-weight:700;cursor:pointer;margin-top:10px;font-family:Rajdhani,sans-serif;letter-spacing:1px;text-transform:uppercase;transition:all .25s}
.copy-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,255,136,.3)}
.msg{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-top:15px;display:none}
.msg.err{background:rgba(255,51,85,.1);color:#ff5577;border:1px solid rgba(255,51,85,.3);display:block}
.msg.loading{background:rgba(0,229,255,.1);color:var(--cyan);border:1px solid rgba(0,229,255,.3);display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,229,255,.3);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:20px;font-size:.7rem;color:var(--muted);letter-spacing:1px}
.footer span{color:var(--cyan)}
.services-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px;justify-content:center}
.service-tag{padding:4px 10px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.15);border-radius:100px;font-size:.65rem;color:var(--muted);letter-spacing:.5px}
</style>
</head>
<body>
<div class="bg-anim"></div>
<div class="container">
<div class="card">
<div class="header">
<div class="badge">Premium Bypass</div>
<h1 class="title">BYPASS TOOL</h1>
<p class="subtitle">Tự động vượt link rút gọn siêu nhanh</p>
</div>

<label class="label">Chọn dịch vụ</label>
<select id="serviceSelect">
<option value="">-- Chọn dịch vụ cần vượt --</option>
{% for s in services %}
<option value="{{ s }}">{{ s }}</option>
{% endfor %}
</select>

<label class="label">Dán link rút gọn</label>
<input type="text" id="urlInput" class="input-url" placeholder="https://...">

<button class="btn" id="btnBypass" onclick="doBypass()">VƯỢT LINK</button>

<div class="msg" id="msg"></div>

<div class="result" id="result">
<h3>Link gốc</h3>
<div class="link-box" id="linkResult"></div>
<button class="copy-btn" onclick="copyLink()">COPY LINK</button>
</div>

<div class="footer">Powered by <span>bypass.vip API</span> - v2.0</div>
</div>
</div>

<script>
(function(){
    for(var i=0;i<20;i++){
        var p=document.createElement("div");
        p.className="particle";
        p.style.left=Math.random()*100+"%";
        p.style.animationDuration=(5+Math.random()*10)+"s";
        p.style.animationDelay=Math.random()*5+"s";
        if(Math.random()>0.5){p.style.background="#a855f7";p.style.boxShadow="0 0 10px #a855f7"}
        document.body.appendChild(p);
    }
})();

async function doBypass(){
    var url = document.getElementById("urlInput").value.trim();
    var service = document.getElementById("serviceSelect").value;
    var msg = document.getElementById("msg");
    var btn = document.getElementById("btnBypass");
    var result = document.getElementById("result");

    if(!url){
        msg.className = "msg err";
        msg.textContent = "Vui lòng dán link cần vượt!";
        return;
    }

    if(!url.startsWith("http")){
        msg.className = "msg err";
        msg.textContent = "Link phải bắt đầu bằng http:// hoặc https://";
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Đang xử lý...';
    msg.className = "msg loading";
    msg.textContent = "Đang bypass, vui lòng đợi...";
    result.classList.remove("show");

    try{
        var res = await fetch("/api/bypass", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({url: url})
        });
        var data = await res.json();

        if(data.ok){
            msg.className = "msg loading";
            msg.textContent = "Bypass thành công!";
            document.getElementById("linkResult").textContent = data.original;
            result.classList.add("show");
        } else {
            msg.className = "msg err";
            msg.textContent = "Lỗi: " + data.error;
        }
    } catch(e){
        msg.className = "msg err";
        msg.textContent = "Lỗi kết nối: " + e.message;
    } finally {
        btn.disabled = false;
        btn.innerHTML = "VƯỢT LINK";
    }
}

function copyLink(){
    var link = document.getElementById("linkResult").textContent;
    navigator.clipboard.writeText(link).then(function(){
        var btn = event.target;
        var old = btn.innerHTML;
        btn.innerHTML = "ĐÃ COPY!";
        setTimeout(function(){ btn.innerHTML = old; }, 2000);
    });
}
</script>
</body>
</html>
